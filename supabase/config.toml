project_id = "hzstynttwwjlhvywemml"

[auth]
enabled = true
site_url = "https://dash-sheet-8engage.vercel.app"
additional_redirect_urls = [
  "https://dash-sheet-8engage.vercel.app/**",
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.validate-share-token]
verify_jwt = false

[functions.create-share-token]
verify_jwt = false

[functions.google-sheets]
verify_jwt = false

[functions.meta-auth]
enabled = true
verify_jwt = false

[functions.meta-api]
enabled = true
verify_jwt = false

[functions.payment-attribution]
enabled = true
verify_jwt = false

[functions.google-ads-api]
enabled = true
verify_jwt = false
